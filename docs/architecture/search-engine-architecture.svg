<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">C++ search engine architecture</title>
  <desc id="desc">Architecture diagram showing ingestion adapters, document normalization, sequential and parallel index builders, persistent index, query engines, browser UI, and optional semantic sidecar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#202832"/><stop offset="1" stop-color="#11161c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#070a0d" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef6847"/></marker>
    <style>
      .label{font:700 18px ui-sans-serif,system-ui,sans-serif;fill:#f2f4f6}.sub{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#aeb8c0}.eyebrow{font:700 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:2px;fill:#ef9b83}.box{fill:#27343e;stroke:#52616d;stroke-width:1.5}.hot{fill:#fff7f2;stroke:#ef6847;stroke-width:2}.olive{fill:#334038;stroke:#788b70;stroke-width:1.5}.arrow{fill:none;stroke:#ef6847;stroke-width:2.5;marker-end:url(#arrow)}.code{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#d8e0e5}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="eyebrow">C++17 / SEARCH ENGINE</text>
  <text x="70" y="115" class="label" style="font-size:34px;letter-spacing:-1px">Build once. Search repeatedly.</text>
  <text x="70" y="146" class="sub">A measurable path from raw content to exact, fuzzy, synonym, and semantic retrieval.</text>

  <rect x="70" y="230" width="240" height="190" rx="18" class="box" filter="url(#shadow)"/>
  <text x="98" y="270" class="eyebrow">INGEST</text><text x="98" y="308" class="label">Source adapters</text><text x="98" y="340" class="code">plain text · PDF</text><text x="98" y="365" class="code">web · SQLite</text><text x="98" y="400" class="sub">→ Document{id, path, text}</text>

  <rect x="370" y="230" width="240" height="190" rx="18" class="box" filter="url(#shadow)"/>
  <text x="398" y="270" class="eyebrow">NORMALIZE</text><text x="398" y="308" class="label">Tokenizer</text><text x="398" y="340" class="sub">lowercase ASCII</text><text x="398" y="365" class="sub">split terms</text><text x="398" y="400" class="code">vector&lt;string&gt;</text>

  <rect x="670" y="200" width="300" height="250" rx="18" class="hot" filter="url(#shadow)"/>
  <text x="704" y="242" class="eyebrow" style="fill:#bc3f29">BUILD</text><text x="704" y="282" class="label" style="fill:#20252d">Inverted index</text><text x="704" y="315" class="code" style="fill:#4b5559">term → postings</text><text x="704" y="348" class="sub" style="fill:#66716e">sequential or 4-worker</text><text x="704" y="373" class="sub" style="fill:#66716e">parallel construction</text><text x="704" y="414" class="sub" style="fill:#66716e">persisted with magic + version</text>

  <rect x="1030" y="230" width="290" height="190" rx="18" class="olive" filter="url(#shadow)"/>
  <text x="1062" y="270" class="eyebrow">STORE</text><text x="1062" y="308" class="label">Persistent index</text><text x="1062" y="342" class="code">sample.index</text><text x="1062" y="374" class="sub">load without rebuilding</text><text x="1062" y="400" class="sub">corruption checks</text>

  <rect x="370" y="540" width="240" height="110" rx="18" class="box" filter="url(#shadow)"/>
  <text x="398" y="580" class="eyebrow">QUERY</text><text x="398" y="616" class="label">CLI + browser UI</text><text x="398" y="639" class="sub">scores · previews · details</text>

  <rect x="670" y="540" width="300" height="110" rx="18" class="box" filter="url(#shadow)"/>
  <text x="704" y="580" class="eyebrow">LEXICAL</text><text x="704" y="616" class="label">Exact · fuzzy · synonyms</text><text x="704" y="639" class="sub">bounded edit distance + dictionary</text>

  <rect x="1030" y="540" width="290" height="110" rx="18" class="box" filter="url(#shadow)"/>
  <text x="1062" y="580" class="eyebrow">OPTIONAL PYTHON</text><text x="1062" y="616" class="label">Embedding sidecar</text><text x="1062" y="639" class="sub">NumPy · Sentence Transformers</text>

  <path d="M310 325H360" class="arrow"/><path d="M610 325H660" class="arrow"/><path d="M970 325H1020" class="arrow"/><path d="M815 460V530" class="arrow"/><path d="M490 530V430" class="arrow"/><path d="M970 595H1020" class="arrow"/>
  <text x="320" y="307" class="sub">Document</text><text x="620" y="307" class="sub">tokens</text><text x="978" y="307" class="sub">binary</text><text x="827" y="500" class="sub">search</text><text x="501" y="490" class="sub">results</text><text x="980" y="575" class="sub">compare</text>

  <rect x="70" y="706" width="1240" height="1" fill="#52616d" opacity=".7"/><text x="70" y="735" class="sub">Measured on the included corpus: indexed queries are sub-millisecond; parallel construction reduces build cost.</text>
</svg>
